name: Update manifest

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Rewrite the manifest from the latest release
        env:
          # Unauthenticated API calls hit the 60/hour limit quickly.
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_manifest.py
      - name: Validate the manifest
        run: python3 -m json.tool bucket/dep-vet.json > /dev/null
      - name: Commit when the version moved
        run: |
          if git diff --quiet; then
            echo "manifest already current"
            exit 0
          fi
          version=$(python3 -c 'import json;print(json.load(open("bucket/dep-vet.json"))["version"])')
          git config user.name "dep-vet bot"
          git config user.email "bot@users.noreply.github.com"
          git add bucket/dep-vet.json
          git commit -m "dep-vet ${version}"
          git push
